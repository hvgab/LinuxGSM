## Predefined Parameters | https://docs.linuxgsm.com/configuration/start-parameters
# Required. This is the name of your save.
stationname="lgsm_stationeers_save_01"

# This is the name of the log file to write to. If not provided, the log will be written to the default log file output_log.txt.
logFile="output_log.txt"

# Stationeers Settings
ServerVisible=true # true / false   Shows / hides the server in the ingame server list
GamePort=27016          # 27016 / any port  The port that players connect to
UpdatePort=27015        # 27015 / any port  Steam update port. Unclear if this is actually used by the game at the moment.
UPNPEnabled=true        # true / false      Enable or disable UniversalPlugAndPlay (Auto port forwarding, your router must support)
ServerName="LGSM Stationeers"  # "My Game Server" / your desired server name
ServerPassword="lgsm"       # "MySuperSecurePassword" / your desired server password
ServerAuthSecret=""     # "MySuperSecureSecret" / your desired admin secret
ServerMaxPlayers=5      # 1-20	            The number of available player slots. Shouln't exceed 20.
AutoSave=true           # true / false	    Enable or disable autosaves
SaveInterval=300        # 300	            Time in seconds between each autosave. Shouldn't be below 60 sec.
AutoPauseServer=true    # true / false	    Weather the server should auto pause or not if no players are connected

# We highly recommend not connecting using Steam P2P for multiplayer as it can cause desyncs and is not nearly as reliable. If the game tries to connect via Steam P2P you will be warned in game.
# https://store.steampowered.com/news/app/544550/view/533235259603419415
UseSteamP2P=false        # true / false	    Weather the server should allow SteamP2P connections. Keep this disabled.

StartLocalHost=true     # true / false	    Do not change this, this is required to be able to connect.
LocalIpAddress="0.0.0.0"  # LocalIpAddress 0.0.0.0 is required to allow the server to bind to all network interfaces on your Linux Server. On some distros, you might wanna specify the actual interface IP instead.

## Server Parameters | https://docs.linuxgsm.com/configuration/start-parameters#additional-parameters
startparameters=" -file start ${stationname} ${worldid} ${difficulty} ${startcondition} ${startlocation} -logFile ${logFile} -settings ServerVisible ${ServerVisible} GamePort ${GamePort} UpdatePort ${UpdatePort} UPNPEnabled ${UPNPEnabled} ServerName \"${ServerName}\" ServerPassword ${ServerPassword} ServerAuthSecret ${ServerAuthSecret} ServerMaxPlayers ${ServerMaxPlayers} AutoSave ${AutoSave} SaveInterval ${SaveInterval} AutoPauseServer ${AutoPauseServer} UseSteamP2P ${UseSteamP2P} StartLocalHost ${StartLocalHost} LocalIpAddress ${LocalIpAddress}"
# When running directly the docs do "& tail -f ${logFile}" at the end. Not sure how this relates in LGSM.

#### LinuxGSM Settings ####

## LinuxGSM Stats
# Send useful stats to LinuxGSM developers.
# https://docs.linuxgsm.com/configuration/linuxgsm-stats
# (on|off)
stats="off"

## Notification Alerts
# (on|off)

# Display IP | https://docs.linuxgsm.com/alerts#display-ip
displayip=""

# More info | https://docs.linuxgsm.com/alerts#more-info
postalert="off"

# Alert on Start/Stop/Restart
statusalert="off"

# Discord Alerts | https://docs.linuxgsm.com/alerts/discord
discordalert="off"
discordwebhook="webhook"

# Email Alerts | https://docs.linuxgsm.com/alerts/email
emailalert="off"
email="email@example.com"
emailfrom=""

# Gotify Alerts | https://docs.linuxgsm.com/alerts/gotify
gotifyalert="off"
gotifytoken="token"
gotifywebhook="webhook"

# IFTTT Alerts | https://docs.linuxgsm.com/alerts/ifttt
iftttalert="off"
ifttttoken="accesstoken"
iftttevent="linuxgsm_alert"

# ntfy Alerts | https://docs.linuxgsm.com/alerts/ntfy
ntfyalert="off"
ntfytopic="LinuxGSM"
ntfyserver="https://ntfy.sh"
ntfytoken=""
ntfyusername=""
ntfypassword=""
ntfypriority=""
ntfytags=""

# Matrix Alerts | https://docs.linuxgsm.com/alerts/matrix
matrixalert="off"
matrixhomeserver="matrix.org"
matrixtoken="accesstoken"
matrixroom=""

# Pushbullet Alerts | https://docs.linuxgsm.com/alerts/pushbullet
pushbulletalert="off"
pushbullettoken="accesstoken"
channeltag=""

# Pushover Alerts | https://docs.linuxgsm.com/alerts/pushover
pushoveralert="off"
pushovertoken="accesstoken"
pushoveruserkey="userkey"

# Rocket.Chat Alerts | https://docs.linuxgsm.com/alerts/rocket.chat
rocketchatalert="off"
rocketchatwebhook="webhook"

# Slack Alerts | https://docs.linuxgsm.com/alerts/slack
slackalert="off"
slackwebhook="webhook"

# Telegram Alerts | https://docs.linuxgsm.com/alerts/telegram
# You can add a custom cURL string eg proxy (useful in Russia) in "curlcustomstring".
# For example "--socks5 ipaddr:port" for socks5 proxy see more in "curl --help all".
telegramapi="api.telegram.org"
telegramalert="off"
telegramtoken="accesstoken"
telegramchatid=""
telegramthreadid=""
